<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DBTI · 养鱼人16型精神图谱</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

    :root {
      --bg: #080c18;
      --surface: #0f1629;
      --surface2: #161f35;
      --border: #1e3058;
      --accent: #00d4ff;
      --accent2: #8b5cf6;
      --accent3: #10b981;
      --gold: #f59e0b;
      --danger: #ef4444;
      --pink: #ec4899;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --glow: 0 0 24px rgba(0,212,255,0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== 粒子背景 ===== */
    canvas#bg {
      position: fixed; top:0; left:0;
      width:100%; height:100%;
      pointer-events:none; z-index:0;
    }

    .wrap {
      position: relative; z-index:1;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px 100px;
    }

    /* ===== 首页 ===== */
    #pg-intro { display:block; }
    .intro-hero {
      text-align:center;
      padding: 56px 0 40px;
    }
    .hero-emoji {
      font-size:80px;
      display:block;
      animation: bob 3s ease-in-out infinite;
    }
    @keyframes bob {
      0%,100%{transform:translateY(0) rotate(-6deg);}
      50%{transform:translateY(-14px) rotate(6deg);}
    }
    .hero-title {
      font-size:52px; font-weight:900; letter-spacing:6px;
      background: linear-gradient(135deg,#00d4ff,#8b5cf6,#10b981,#f59e0b);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; margin:12px 0 6px;
    }
    .hero-sub {
      font-size:17px; color:var(--text-muted); letter-spacing:2px; margin-bottom:4px;
    }
    .hero-en {
      font-size:12px; color:var(--accent); letter-spacing:3px; opacity:.6; margin-bottom:44px;
    }
    .intro-desc {
      background:var(--surface); border:1px solid var(--border);
      border-radius:20px; padding:28px 32px;
      margin-bottom:32px; text-align:left;
    }
    .intro-desc h3 { color:var(--accent); font-size:15px; margin-bottom:16px; letter-spacing:1px; }
    .intro-desc p { font-size:14px; color:var(--text-muted); line-height:1.9; }
    .intro-desc strong { color:var(--text); }

    .type-preview {
      display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:32px;
    }
    .tp-chip {
      background:var(--surface); border:1px solid var(--border);
      border-radius:12px; padding:10px 8px; text-align:center;
      cursor:pointer; transition:all .2s;
    }
    .tp-chip:hover { border-color:var(--accent); background:rgba(0,212,255,.05); transform:translateY(-2px); }
    .tp-chip-emoji { font-size:22px; margin-bottom:4px; }
    .tp-chip-code { font-size:13px; font-weight:700; color:var(--accent); letter-spacing:1px; }
    .tp-chip-name { font-size:11px; color:var(--text-muted); margin-top:2px; }

    .btn-big {
      display:inline-block;
      background:linear-gradient(135deg,#00d4ff,#8b5cf6);
      color:#fff; font-size:18px; font-weight:700;
      padding:16px 60px; border-radius:50px;
      cursor:pointer; border:none; letter-spacing:2px;
      box-shadow:0 0 32px rgba(0,212,255,.45);
      transition:all .3s; font-family:inherit;
    }
    .btn-big:hover { transform:translateY(-4px); box-shadow:0 0 56px rgba(0,212,255,.65); }

    /* ===== 测试页 ===== */
    #pg-quiz { display:none; }
    .quiz-top { padding:40px 0 20px; text-align:center; }
    .prog-wrap { background:var(--surface2); border-radius:8px; height:6px; margin-bottom:8px; overflow:hidden; }
    .prog-bar {
      height:100%; border-radius:8px;
      background:linear-gradient(90deg,#00d4ff,#8b5cf6);
      transition:width .5s ease;
    }
    .prog-txt { font-size:13px; color:var(--text-muted); margin-bottom:28px; }

    .q-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:22px; padding:36px 32px; margin-bottom:20px;
      animation:fadeUp .4s ease;
    }
    @keyframes fadeUp {
      from{opacity:0;transform:translateY(18px);}
      to{opacity:1;transform:translateY(0);}
    }
    .q-scene {
      font-size:12px; letter-spacing:2px; color:var(--text-muted);
      margin-bottom:14px; font-weight:500;
    }
    .q-text {
      font-size:20px; font-weight:600; line-height:1.65; margin-bottom:28px; color:var(--text);
    }
    .opts { display:grid; gap:10px; }
    .opt {
      background:var(--surface2); border:1px solid var(--border);
      border-radius:14px; padding:16px 18px;
      color:var(--text); font-size:15px; line-height:1.55;
      cursor:pointer; transition:all .22s; text-align:left;
      font-family:inherit; display:flex; align-items:flex-start; gap:12px;
    }
    .opt:hover { border-color:var(--accent); background:rgba(0,212,255,.05); transform:translateX(5px); }
    .opt.sel { border-color:var(--accent); background:rgba(0,212,255,.1); box-shadow:var(--glow); }
    .opt-ab {
      flex-shrink:0; width:28px; height:28px; border-radius:50%;
      background:var(--border); display:flex; align-items:center;
      justify-content:center; font-size:12px; font-weight:800; color:var(--accent);
    }

    .nav-row { display:flex; gap:12px; margin-top:4px; }
    .btn-nav {
      flex:1; padding:14px; border-radius:12px;
      border:1px solid var(--border); background:var(--surface2);
      color:var(--text); font-size:15px; cursor:pointer;
      transition:all .22s; font-family:inherit; font-weight:500;
    }
    .btn-nav:hover { border-color:var(--accent); }
    .btn-nav.pri {
      background:linear-gradient(135deg,#00d4ff,#8b5cf6);
      border:none; color:#fff; font-weight:700;
    }
    .btn-nav.pri:hover { box-shadow:var(--glow); transform:translateY(-2px); }
    .btn-nav:disabled { opacity:.3; cursor:not-allowed; transform:none!important; }

    /* ===== 结果页 ===== */
    #pg-result { display:none; }
    .res-hero { text-align:center; padding:52px 0 28px; }
    .res-emoji { font-size:88px; display:block; animation:popIn .8s ease; }
    @keyframes popIn {
      from{transform:scale(0) rotate(-180deg);opacity:0;}
      to{transform:scale(1) rotate(0);opacity:1;}
    }
    .res-code {
      font-size:64px; font-weight:900; letter-spacing:8px;
      background:linear-gradient(135deg,#00d4ff,#8b5cf6,#10b981,#f59e0b);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; margin:10px 0 8px;
      animation:fadeUp .6s ease .3s both;
    }
    .res-name {
      font-size:24px; font-weight:700; color:var(--accent);
      margin-bottom:4px; animation:fadeUp .6s ease .5s both;
    }
    .res-alias {
      font-size:14px; color:var(--text-muted);
      animation:fadeUp .6s ease .7s both;
    }

    .res-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:20px; padding:26px 28px; margin-bottom:18px;
      animation:fadeUp .6s ease .9s both;
    }
    .res-card h3 {
      font-size:12px; letter-spacing:2px; color:var(--text-muted);
      margin-bottom:14px; text-transform:uppercase;
    }

    .quote-banner {
      background:linear-gradient(135deg,rgba(0,212,255,.06),rgba(139,92,246,.06));
      border:1px solid rgba(0,212,255,.2); border-radius:16px;
      padding:22px 26px; text-align:center; margin-bottom:18px;
      font-size:17px; line-height:1.75; color:var(--text);
      animation:fadeUp .6s ease .7s both;
    }
    .quote-banner .qs { color:var(--accent); font-weight:700; font-style:normal; }

    .setting-text {
      font-size:16px; line-height:1.85; color:var(--text); margin-bottom:14px;
    }
    .alias-row {
      display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;
    }
    .alias-tag {
      background:rgba(139,92,246,.12); border:1px solid rgba(139,92,246,.25);
      color:var(--accent2); border-radius:20px; padding:4px 12px; font-size:12px; font-weight:500;
    }
    .quote-box {
      background:rgba(245,158,11,.07); border:1px solid rgba(245,158,11,.22);
      border-radius:12px; padding:12px 18px; font-size:14px; color:var(--gold); line-height:1.7;
    }
    .quote-box em { font-style:normal; font-weight:700; }

    /* 雷达/匹配度 */
    .match-grid {
      display:grid; gap:10px;
    }
    .match-row { display:flex; align-items:center; gap:12px; }
    .match-label {
      width:90px; flex-shrink:0; font-size:13px; color:var(--text-muted); text-align:right;
    }
    .match-track {
      flex:1; background:var(--surface2); border-radius:6px; height:9px; overflow:hidden;
    }
    .match-fill {
      height:100%; border-radius:6px; transition:width 1.2s ease .8s;
    }
    .match-pct { width:36px; flex-shrink:0; font-size:12px; color:var(--text-muted); text-align:right; }

    /* 全部类型 */
    .all-grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px;
    }
    .ac {
      background:var(--surface2); border:1px solid var(--border);
      border-radius:10px; padding:10px 8px; text-align:center;
      cursor:pointer; transition:all .2s;
    }
    .ac:hover { border-color:var(--accent); background:rgba(0,212,255,.05); }
    .ac.mine { border-color:var(--accent); background:rgba(0,212,255,.1); }
    .ac-emoji { font-size:20px; }
    .ac-code { font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.5px; }
    .ac-name { font-size:10px; color:var(--text-muted); margin-top:2px; }

    .btn-retry {
      display:block; width:100%; padding:15px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:14px; color:var(--text); font-size:15px;
      cursor:pointer; font-family:inherit; font-weight:500;
      transition:all .3s; margin-top:14px;
    }
    .btn-retry:hover { border-color:var(--accent); box-shadow:var(--glow); }

    /* 弹窗 */
    .overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:200;
      display:flex; align-items:center; justify-content:center; padding:20px;
      opacity:0; pointer-events:none; transition:opacity .3s;
    }
    .overlay.on { opacity:1; pointer-events:all; }
    .mbox {
      background:var(--surface); border:1px solid var(--border);
      border-radius:22px; padding:32px; max-width:500px; width:100%;
      max-height:88vh; overflow-y:auto;
      transform:scale(.88); transition:transform .3s;
    }
    .overlay.on .mbox { transform:scale(1); }
    .mclose {
      float:right; background:none; border:none; color:var(--text-muted);
      font-size:22px; cursor:pointer; line-height:1;
    }
    .m-emoji { font-size:48px; display:block; margin:10px 0 8px; }
    .m-code {
      font-size:36px; font-weight:900; letter-spacing:4px;
      background:linear-gradient(135deg,#00d4ff,#8b5cf6);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; margin-bottom:4px;
    }
    .m-name { font-size:18px; font-weight:700; color:var(--accent); margin-bottom:12px; }
    .m-alias { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
    .m-alias span {
      background:rgba(139,92,246,.12); border:1px solid rgba(139,92,246,.25);
      color:var(--accent2); border-radius:20px; padding:3px 10px; font-size:11px;
    }
    .m-setting { font-size:14px; line-height:1.85; margin-bottom:12px; }
    .m-quote {
      background:rgba(245,158,11,.07); border:1px solid rgba(245,158,11,.22);
      border-radius:10px; padding:10px 14px; font-size:13px; color:var(--gold); line-height:1.7;
    }
    .m-quote em { font-style:normal; font-weight:700; }

    @media(max-width:560px){
      .hero-title{font-size:38px;}
      .type-preview,.all-grid{grid-template-columns:repeat(4,1fr);}
      .q-text{font-size:17px;}
      .res-code{font-size:44px;}
      .res-name{font-size:18px;}
    }
  </style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- ====== 首页 ====== -->
<div id="pg-intro">
  <div class="wrap">
    <div class="intro-hero">
      <span class="hero-emoji">🐟</span>
      <h1 class="hero-title">DBTI</h1>
      <p class="hero-en">我呆固我在，别人笑我太疯癫，我笑别人看不穿</p>
    </div>

    <div class="intro-desc">
      <h3>🧬 关于这份测试</h3>
      <p>
        通过 <strong>12 道情景题</strong>，从你的<strong>花钱方式、鱼的存活率、处理方式、扩张欲望</strong>四个维度，
        把你精准匹配到 16 种养鱼人格之一。<br><br>
        无论你是 <strong>鱼市提款机 ATM</strong>，还是 <strong>忍辱负重的家属 HELP</strong>，
        这里都有你的位置。
      </p>
    </div>

    <div class="type-preview" id="intro-types"></div>

    <div style="text-align:center;margin-bottom:12px;">
      <p style="color:var(--text-muted);font-size:14px;margin-bottom:22px;">共 12 道题 · 约 3 分钟 · 结果100%精准（误差±16种）</p>
      <button class="btn-big" onclick="startQuiz()">🎣 开始测试</button>
    </div>
  </div>
</div>

<!-- ====== 测试页 ====== -->
<div id="pg-quiz">
  <div class="wrap">
    <div class="quiz-top">
      <div class="prog-wrap"><div class="prog-bar" id="prog" style="width:0%"></div></div>
      <div class="prog-txt" id="prog-txt">第 1 题 / 共 12 题</div>
    </div>
    <div id="q-area"></div>
    <div class="nav-row">
      <button class="btn-nav" id="btn-prev" onclick="prevQ()" disabled>← 上一题</button>
      <button class="btn-nav pri" id="btn-next" onclick="nextQ()">下一题 →</button>
    </div>
  </div>
</div>

<!-- ====== 结果页 ====== -->
<div id="pg-result">
  <div class="wrap">
    <div class="res-hero">
      <span class="res-emoji" id="r-emoji">🐟</span>
      <div class="res-code" id="r-code">ATM</div>
      <div class="res-name" id="r-name">鱼市提款机</div>
      <div class="res-alias" id="r-alias">冤种巨富 / 商家最爱</div>
    </div>

    <div class="quote-banner" id="r-quote"></div>

    <div class="res-card">
      <h3>📋 人格设定</h3>
      <div class="alias-row" id="r-alias-tags"></div>
      <div class="setting-text" id="r-setting"></div>
      <div class="quote-box" id="r-qbox"></div>
    </div>

    <div class="res-card">
      <h3>📊 与各人格匹配度</h3>
      <div class="match-grid" id="r-match"></div>
    </div>

    <div class="res-card">
      <h3>🌊 全部 16 型 · 点击查看</h3>
      <div class="all-grid" id="r-all"></div>
    </div>

    <button class="btn-retry" onclick="retryQuiz()">🔄 重新测试 · 看看这次你是哪只</button>
  </div>
</div>

<!-- 弹窗 -->
<div class="overlay" id="modal" onclick="closeM(event)">
  <div class="mbox">
    <button class="mclose" onclick="closeM(null)">✕</button>
    <span class="m-emoji" id="m-emoji"></span>
    <div class="m-code" id="m-code"></div>
    <div class="m-name" id="m-name"></div>
    <div class="m-alias" id="m-alias"></div>
    <div class="m-setting" id="m-setting"></div>
    <div class="m-quote" id="m-quote"></div>
  </div>
</div>

<script>
// ===================== 粒子背景 =====================
(()=>{
  const c=document.getElementById('bg'),ctx=c.getContext('2d');
  let W,H;
  const resize=()=>{W=c.width=innerWidth;H=c.height=innerHeight;};
  resize(); addEventListener('resize',resize);
  const cols=['#00d4ff','#8b5cf6','#10b981','#f59e0b','#ef4444','#ec4899'];
  const pts=Array.from({length:22},()=>({
    x:Math.random(),vy:Math.random()*.25+.08,
    r:Math.random()*5+2,col:cols[Math.random()*cols.length|0],
    op:Math.random()*.25+.08,ph:Math.random()*Math.PI*2
  }));
  let t0=null;
  const draw=ts=>{
    if(!t0)t0=ts;
    const t=(ts-t0)/1000;
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      const y=H-(((t*p.vy*50+p.ph*H/Math.PI/2)%H+H)%H);
      const x=p.x*W+Math.sin(t*.4+p.ph)*28;
      ctx.beginPath();ctx.arc(x,y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.col+(Math.round(p.op*255).toString(16).padStart(2,'0'));
      ctx.fill();
    });
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
})();

// ===================== 16 型数据 =====================
const TYPES = {

    quote:'我不知道它为什么死，我只知道换一条新的要多少钱。',
    scores:{money:3,death:3,logic:0,expand:2}
  },
  DEAD:{
    name:'灵位批发商', emoji:'⚰️',
    alias:['死鱼大师','鱼见愁'],
    setting:'养啥死啥，缸里常年漂着白毛，网兜是他身体的延伸。不是他不努力，是鱼的寿命跟他天生八字不合。',
    quote:'这批鱼命薄，不怪我，下一批肯定能活过头七。',
    scores:{money:1,death:3,logic:0,expand:2}
  },
  JUMP:{

    quote:'诶？昨晚还在缸里，今天怎么在沙发缝里缩成小鱼干了？',
    scores:{money:1,death:3,logic:0,expand:0}
  },
  OJBK:{
    name:'佛系送走人', emoji:'🧘',

    quote:'鱼生如梦，走了便走了，换桶自来水又是一条好汉。',
    scores:{money:0,death:2,logic:0,expand:0}
  },
  SHIT:{
    name:'喂食过量的神', emoji:'🍚',

    quote:'看它抢食多开心啊！什么？那是撑得翻肚皮了？',
    scores:{money:1,death:3,logic:0,expand:1}
  },
  PURE:{
    name:'裸缸原批', emoji:'🪟',
    alias:['极简主义疯子','玻璃擦拭者'],
    setting:'缸里除了水和鱼，连颗沙子都没有。一丝多余的东西都是污染，一块造景石都是对纯粹的侵犯。',
    quote:'造景只会影响我观察鱼鳞的角度，那是亵渎。',
    scores:{money:3,death:0,logic:3,expand:0}
  },
  DIYER:{
    name:'叙利亚工程师', emoji:'🔧',
    alias:['破烂王','漏电先锋'],
    setting:'绝不买成品。外卖盒做过滤，洗衣机管抽水，家里随时像要爆炸。但水质出奇地好，鱼出奇地难死。',
    quote:'花那钱干啥？我用这废旧塑料瓶改的滤桶不香吗？（滋——被电了一下）',
    scores:{money:0,death:0,logic:3,expand:2}
  },
  RICH:{
    name:'滤材皇帝', emoji:'👑',

// ===================== 状态 =====================
let cur=0, answers={};
// 每个类型的累计得分
let typeScores={};

function resetState(){
  cur=0; answers={};
  typeScores={};
  Object.keys(TYPES).forEach(k=>typeScores[k]=0);
}

function calcTypeScores(){
  // 根据答案计算每种类型的匹配分
  // 方法：用每道题选项的scores与每种类型的scores做相似度
  Object.keys(TYPES).forEach(k=>{
    let total=0;
    Object.values(answers).forEach(optIdx_q=>{
      // optIdx_q = {q: question index, opt: option index}
    });
    typeScores[k]=0;
  });

  // 重新实现：用余弦相似度
  // 用户画像向量
  const userVec={money:0,death:0,logic:0,expand:0};
  Object.entries(answers).forEach(([qi,oi])=>{
    const opt=QUESTIONS[qi].opts[oi];
    Object.entries(opt.scores).forEach(([dim,val])=>{
      userVec[dim]+=val;
    });
  });

  // 与每种类型做点积
  const dims=['money','death','logic','expand'];
  Object.entries(TYPES).forEach(([k,t])=>{
    let dot=0,normT=0,normU=0;
    dims.forEach(d=>{
      dot+=userVec[d]*t.scores[d];
      normT+=t.scores[d]**2;
      normU+=userVec[d]**2;
    });
    const sim = normT===0||normU===0 ? 0 : dot/Math.sqrt(normT)/Math.sqrt(normU);
    typeScores[k]=sim;
  });
}

function getTopType(){
  return Object.entries(typeScores).sort((a,b)=>b[1]-a[1])[0][0];
}

// ===================== 首页预览 =====================
function renderIntroTypes(){
  const el=document.getElementById('intro-types');
  Object.entries(TYPES).forEach(([code,t])=>{
    const d=document.createElement('div');
    d.className='tp-chip';
    d.innerHTML=`<div class="tp-chip-emoji">${t.emoji}</div>
      <div class="tp-chip-code">${code}</div>
      <div class="tp-chip-name">${t.name}</div>`;
    d.onclick=()=>openModal(code);
    el.appendChild(d);
  });
}
renderIntroTypes();

// ===================== 测试逻辑 =====================
function startQuiz(){
  resetState();
  document.getElementById('pg-intro').style.display='none';
  document.getElementById('pg-quiz').style.display='block';
  renderQ();
}

function renderQ(){
  const q=QUESTIONS[cur];
  const pct=(cur/QUESTIONS.length*100).toFixed(0);
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('prog-txt').textContent=`第 ${cur+1} 题 / 共 ${QUESTIONS.length} 题`;

  let html=`<div class="q-card">
    <div class="q-scene">${q.scene}</div>
    <div class="q-text">${q.text}</div>
    <div class="opts">`;
  const labs=['A','B','C','D'];
  q.opts.forEach((o,i)=>{
    const sel=answers[cur]===i?'sel':'';
    html+=`<button class="opt ${sel}" onclick="pickOpt(${i})">
      <div class="opt-ab">${labs[i]}</div>
      <div>${o.t}</div>
    </button>`;
  });
  html+=`</div></div>`;
  document.getElementById('q-area').innerHTML=html;

  document.getElementById('btn-prev').disabled=cur===0;
  const btnN=document.getElementById('btn-next');
  if(cur===QUESTIONS.length-1){
    btnN.textContent='🎯 查看结果';
    btnN.onclick=showResult;
  } else {
    btnN.textContent='下一题 →';
    btnN.onclick=nextQ;
  }
  btnN.disabled=answers[cur]===undefined;
}

function pickOpt(i){
  answers[cur]=i;
  document.getElementById('btn-next').disabled=false;
  renderQ();
  setTimeout(()=>{
    if(cur<QUESTIONS.length-1) nextQ();
    else showResult();
  },380);
}

function nextQ(){
  if(answers[cur]===undefined)return;
  if(cur<QUESTIONS.length-1){cur++;renderQ();}
}
function prevQ(){
  if(cur>0){cur--;renderQ();}
}

// ===================== 结果 =====================
function showResult(){
  calcTypeScores();
  const code=getTopType();
  const d=TYPES[code];

  document.getElementById('pg-quiz').style.display='none';
  document.getElementById('pg-result').style.display='block';
  window.scrollTo(0,0);

  document.getElementById('r-emoji').textContent=d.emoji;
  document.getElementById('r-code').textContent=code;
  document.getElementById('r-name').textContent=d.name;
  document.getElementById('r-alias').textContent=d.alias.join(' / ');
  document.getElementById('r-quote').innerHTML=`<em class="qs">「</em> ${d.quote} <em class="qs">」</em>`;

  // 别名标签
  const aTags=document.getElementById('r-alias-tags');
  aTags.innerHTML='';
  d.alias.forEach(a=>{
    const s=document.createElement('span');
    s.className='alias-tag'; s.textContent=a;
    aTags.appendChild(s);
  });

  document.getElementById('r-setting').textContent=d.setting;
  document.getElementById('r-qbox').innerHTML=`🗣 核心语录：<em>"${d.quote}"</em>`;

  // 匹配度排名（前8名）
  const sorted=Object.entries(typeScores)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,8);
  const maxScore=sorted[0][1]||1;
  const barColors=['#00d4ff','#8b5cf6','#10b981','#f59e0b','#ef4444','#ec4899','#64748b','#94a3b8'];
  let mHtml='';
  sorted.forEach(([k,v],i)=>{
    const pct=Math.round(v/maxScore*100);
    mHtml+=`<div class="match-row">
      <div class="match-label">${TYPES[k].emoji} ${k}</div>
      <div class="match-track"><div class="match-fill" style="width:0%;background:${barColors[i]}" data-pct="${pct}%"></div></div>
      <div class="match-pct">${pct}%</div>
    </div>`;
  });
  document.getElementById('r-match').innerHTML=mHtml;
  setTimeout(()=>{
    document.querySelectorAll('.match-fill').forEach(el=>{
      el.style.width=el.dataset.pct;
    });
  },120);

  // 全部类型
  const allEl=document.getElementById('r-all');
  allEl.innerHTML='';
  Object.entries(TYPES).forEach(([k,t])=>{
    const c=document.createElement('div');
    c.className='ac'+(k===code?' mine':'');
    c.innerHTML=`<div class="ac-emoji">${t.emoji}</div>
      <div class="ac-code">${k}</div>
      <div class="ac-name">${t.name}</div>`;
    c.onclick=()=>openModal(k);
    allEl.appendChild(c);
  });
}

function retryQuiz(){
  document.getElementById('pg-result').style.display='none';
  startQuiz();
}

// ===================== 弹窗 =====================
function openModal(code){
  const d=TYPES[code];
  document.getElementById('m-emoji').textContent=d.emoji;
  document.getElementById('m-code').textContent=code;
  document.getElementById('m-name').textContent=d.name;
  const ma=document.getElementById('m-alias');
  ma.innerHTML='';
  d.alias.forEach(a=>{const s=document.createElement('span');s.textContent=a;ma.appendChild(s);});
  document.getElementById('m-setting').textContent=d.setting;
  document.getElementById('m-quote').innerHTML=`🗣 <em>"${d.quote}"</em>`;
  document.getElementById('modal').classList.add('on');
}
function closeM(e){
  if(e&&e.target!==document.getElementById('modal'))return;
  document.getElementById('modal').classList.remove('on');
}
