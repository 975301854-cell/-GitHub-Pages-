.main { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; }
.content { flex: 1; padding: 24px 32px; }

.sidebar-logo { display: flex; align-items: center; gap: 10px; }

.sidebar-logo-text { font-weight: 700; font-size: 15px; }

.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; margin-bottom: 2px; }
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { background: var(--primary-light); color: var(--primary); }
.nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
.nav-badge { margin-left: auto; background: var(--danger); color: white; font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 600; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-tertiary); }

.topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }

.topbar-search svg { width: 18px; height: 18px; color: var(--text-tertiary); }
.topbar-actions { display: flex; align-items: center; gap: 12px; }

.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); }
.card-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 16px; font-weight: 700; }
.card-body { padding: 20px; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }

.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; }

.badge-danger { background: var(--danger-light); color: var(--danger); }

.btn-primary { background: var(--primary); color: white; }

.btn-outline { border: 1px solid var(--border); color: var(--text-secondary); background: var(--card); }

.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; }

.camp-tab { padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text-secondary); font-weight: 500; font-size: 13px; cursor: pointer; transition: all 0.15s; }

const DATA_VERSION = '2.2';
const STORAGE_KEY = 'respal_influencer_workbench_v2';

const DB = {
  get() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        const d = JSON.parse(stored);
        if (d.influencers && d.influencers.length > 0) {
          // v2.1+: merge/update August data for returning visitors
          if (!d.meta || d.meta.version !== DATA_VERSION) {
            const existingIds = new Set(d.influencers.map(i=>i.id));
            AUGUST_DATA.forEach(aug => {
              const target = d.influencers.find(i=>i.id===aug.id);
              if (target) {
                // refresh fields from the latest Tencent Docs sheet (only when sheet has values)
                ['homepageUrl','platform','name','followersWan','followers','coopType','category','publishLink1','publishLink2'].forEach(f => {
                  if (aug[f]) target[f] = aug[f];
                });
              } else {
                d.influencers.push(aug);
              }
            });
            d.meta = Object.assign({}, d.meta, {version: DATA_VERSION});
            this.save(d);
          }
          return d;
        }
      }
      return this.init();
    } catch(e) { return this.init(); }
  },
  save(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); },
  init() {
    const data = {
      influencers: INITIAL_DATA.concat(AUGUST_DATA).map((inf, i) => ({...inf, id: inf.id || ('inf_' + (i+1).toString().padStart(3,'0'))})),
      meta: { createdAt: new Date().toISOString(), version: DATA_VERSION, source: '腾讯文档-研伴respal达人筛选表' }
    };
    this.save(data);
    return data;
  },
  reset() {
    localStorage.removeItem(STORAGE_KEY);
    return this.init();
  }
};

function uid(prefix='id') { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).substr(2,4); }
function fmt(n) {
  if (!n) return '0';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return n.toString();
}
function fmtDate(d) { return d || '-'; }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function statusBadge(status) {
  const map = {'已合作':'badge-success','已确认':'badge-primary','待筛选':'badge-warning','不合作':'badge-danger'};
  return '<span class="badge ' + (map[status]||'badge-gray') + '">' + status + '</span>';
}

const PAGE_TITLES = { dashboard:'工作台首页', influencers:'达人库', analysis:'达人分析', campaigns:'投放管理', export:'数据导出' };
let currentPage = 'dashboard';

function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelector('.nav-item[data-page="' + page + '"]')?.classList.add('active');
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page] || '';
  renderPage();
}

function renderPage() {
  const content = document.getElementById('pageContent');
  const data = DB.get();
  document.getElementById('navInfCount').textContent = data.influencers.length;
  const cooperated = data.influencers.filter(i=>i.status==='已合作').length;
  document.getElementById('navCmpCount').textContent = cooperated;
  switch(currentPage) {
    case 'dashboard': content.innerHTML = renderDashboard(); initDashboard(); break;
    case 'influencers': content.innerHTML = renderInfluencers(); renderInfTable(); break;
    case 'analysis': content.innerHTML = renderAnalysis(); break;
    case 'campaigns': content.innerHTML = renderCampaigns(); break;
    case 'export': content.innerHTML = renderExport(); break;
  }
}

function handleGlobalSearch(val) {
  if (currentPage === 'influencers') {
    const input = document.getElementById('infSearchInput');
    if (input) { input.value = val; filterInfluencers(); }
  } else if (val.trim()) {
    navigateTo('influencers');
    setTimeout(() => { const input = document.getElementById('infSearchInput'); if (input) { input.value = val; filterInfluencers(); } }, 100);
  }
}

function initDashboard() {
  const data = DB.get();
  const infs = data.influencers;
  const categories = {};
  infs.forEach(i => { const c = i.category || '未分类'; categories[c] = (categories[c]||0)+1; });
  const catLabels = Object.keys(categories);
  const catValues = Object.values(categories);
  
  const ctx1 = document.getElementById('chartCategory');
  if (ctx1) new Chart(ctx1, {type:'bar',data:{labels:catLabels,datasets:[{data:catValues,backgroundColor:'#4F6FED',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}});
  
  const statuses = {'已合作':0,'待筛选':0,'已确认':0,'不合作':0};
  infs.forEach(i => { if(statuses[i.status]!==undefined) statuses[i.status]++; });
  const ctx2 = document.getElementById('chartStatus');
  if (ctx2) new Chart(ctx2, {type:'doughnut',data:{labels:Object.keys(statuses),datasets:[{data:Object.values(statuses),backgroundColor:['#00B894','#F59E0B','#4F6FED','#EF4444'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'}}}});
}

function renderInfTable() {
  const data = DB.get();
  let filtered = data.influencers;
  if (infFilter.keyword) filtered = filtered.filter(i => i.name.includes(infFilter.keyword) || (i.category||'').includes(infFilter.keyword) || (i.highlights||'').includes(infFilter.keyword));
  if (infFilter.status) filtered = filtered.filter(i => i.status === infFilter.status);
  if (infFilter.category) filtered = filtered.filter(i => i.category === infFilter.category);
  if (infFilter.coopType) filtered = filtered.filter(i => (i.coopType||'').includes(infFilter.coopType));
  
  document.getElementById('infCount').textContent = '(' + filtered.length + '条)';
  const totalPages = Math.ceil(filtered.length / infPageSize);
  if (infPage > totalPages) infPage = 1;
  const start = (infPage-1)*infPageSize;
  const pageData = filtered.slice(start, start+infPageSize);
  
  const wrap = document.getElementById('infTableWrap');
  if (pageData.length === 0) {
    wrap.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>没有匹配的达人</p></div>';
  } else {
    wrap.innerHTML = '<table class="data-table"><thead><tr><th>达人名称</th><th>平台</th><th>粉丝量</th><th>状态</th><th>报备/水下</th><th>分类</th><th>联系人</th><th>联系方式</th><th>亮点</th><th>最终价格</th><th>成本</th><th>播放量</th><th>点赞</th><th>收藏</th><th>总互动</th><th>同步平台</th><th>操作</th></tr></thead><tbody>' +
      pageData.map(inf => `
        <tr>
          <td><a href="${inf.homepageUrl||'#'}" target="_blank" title="${escapeHtml(inf.homepageUrl||'')}">${escapeHtml(inf.name)}</a></td>
          <td>${inf.platform?'<span class="badge '+(inf.platform==='小红书'?'badge-danger':'badge-gray')+'" style="white-space:nowrap">'+escapeHtml(inf.platform)+'</span>':'-'}</td>
          <td>${inf.followersWan?inf.followersWan+'万':'-'}</td>
          <td>${statusBadge(inf.status)}</td>
          <td>${inf.coopType?'<span class="badge '+(inf.coopType.includes('报备')?'badge-primary':'badge-warning')+'">'+escapeHtml(inf.coopType)+'</span>':'-'}</td>
          <td>${escapeHtml(inf.category||'-')}</td>
          <td>${escapeHtml(inf.contactPerson||'-')}</td>
          <td>${escapeHtml(inf.contactInfo||'-')}</td>
          <td style="max-width:150px" title="${escapeHtml(inf.highlights||'')}">${escapeHtml(inf.highlights||'-')}</td>
          <td title="${escapeHtml(inf.finalPrice||'')}" style="max-width:120px">${escapeHtml((inf.finalPrice||'-').substring(0,20))}${inf.finalPrice&&inf.finalPrice.length>20?'...':''}</td>
          <td>${inf.cost?'\u00a5'+inf.cost:'-'}</td>
          <td>${fmt(inf.views)}</td>
          <td>${fmt(inf.likes)}</td>
          <td>${fmt(inf.saves)}</td>
          <td><b>${fmt(inf.totalEngagement)}</b></td>
          <td>${escapeHtml(inf.syncPlatform||'-')}</td>
          <td><button class="btn btn-outline" style="padding:4px 10px;font-size:12px" onclick="openInfModal('${inf.id}')">编辑</button> <button class="btn btn-danger" style="padding:4px 10px;font-size:12px" onclick="deleteInf('${inf.id}')">删除</button></td>
        </tr>
      `).join('') + '</tbody></table>';
  }
  
  const pag = document.getElementById('infPagination');
  if (totalPages > 1) {
    pag.innerHTML = '<button '+(infPage<=1?'disabled':'')+' onclick="infPage--;renderInfTable()">&laquo;</button>' +
      Array.from({length:totalPages},(_,i) => '<button class="'+(i+1===infPage?'active':'')+'" onclick="infPage='+(i+1)+';renderInfTable()">'+(i+1)+'</button>').join('') +
      '<button '+(infPage>=totalPages?'disabled':'')+' onclick="infPage++;renderInfTable()">&raquo;</button>';
  } else {
    pag.innerHTML = '';
  }
}

function saveInf(id) {
  const data = DB.get();
  const getVal = (id) => document.getElementById(id)?.value?.trim() || '';
  const followersWan = parseFloat(getVal('f_followers'))||0;
  const newInf = {
    name: getVal('f_name'), platform: getVal('f_platform'), homepageUrl: getVal('f_url'),
    followersWan: followersWan, followers: Math.round(followersWan*10000),
    status: getVal('f_status'), coopType: getVal('f_coop'), category: getVal('f_category'),
    contactPerson: getVal('f_contactP'), contactInfo: getVal('f_contactI'),
    highlights: getVal('f_highlights'), finalPrice: getVal('f_price'),
    cost: parseInt(getVal('f_cost'))||0, views: parseInt(getVal('f_views'))||0,
    likes: parseInt(getVal('f_likes'))||0, saves: parseInt(getVal('f_saves'))||0,
    shares: parseInt(getVal('f_shares'))||0, publishDate: getVal('f_pdate'),
    syncPlatform: getVal('f_sync'), redemptionCode: getVal('f_code'),
    publishLink1: getVal('f_link1'), publishLink2: getVal('f_link2'),
    notes: getVal('f_notes'),
    totalEngagement: (parseInt(getVal('f_views'))||0)+(parseInt(getVal('f_likes'))||0)+(parseInt(getVal('f_saves'))||0)
  };
  if (!newInf.name) { showToast('请填写博主名称'); return; }
  if (id) {
    const idx = data.influencers.findIndex(i=>i.id===id);
    if (idx>-1) data.influencers[idx] = {...data.influencers[idx], ...newInf};
  } else {
    newInf.id = uid('inf');
    newInf.source = '手动添加';
    data.influencers.push(newInf);
  }
  DB.save(data);
  closeModal();
  showToast(id?'更新成功':'添加成功');
  renderInfTable();
  document.getElementById('navInfCount').textContent = data.influencers.length;
}

function deleteInf(id) {
  if (!confirm('确认删除这条达人记录？')) return;
  const data = DB.get();
  data.influencers = data.influencers.filter(i=>i.id!==id);
  DB.save(data);
  showToast('删除成功');
  renderInfTable();
  document.getElementById('navInfCount').textContent = data.influencers.length;
}

function resetData() {
  if (!confirm('重置将恢复到从腾讯文档导入的初始数据，所有手动修改将丢失。确认？')) return;
  DB.reset();
  showToast('数据已重置');
  renderPage();
}

function generateReport() {
  const url = document.getElementById('analysisUrl').value.trim();
  if (!url) { showToast('请粘贴达人主页链接'); return; }
  const data = DB.get();
  // Try to match existing influencer
  let inf = data.influencers.find(i => i.homepageUrl && (i.homepageUrl.includes(url) || url.includes(i.homepageUrl) || (i.name && url.includes(i.name))));
  let reportData;
  if (inf) {
    reportData = inf;
  } else {
    // Generate a template report from URL
    reportData = { name: '新达人', homepageUrl: url, status: '待分析', followersWan: 0, category: '', highlights: '', views: 0, likes: 0, saves: 0, cost: 0, finalPrice: '', notes: '' };
  }
  renderReport(reportData);
}

function loadExistingInf() {
  const data = DB.get();
  const options = data.influencers.map((inf,i) => `<option value="${inf.id}">${escapeHtml(inf.name)} (${inf.status})</option>`).join('');
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-header"><div class="modal-title">从达人库选择</div><div class="modal-close" onclick="closeModal()">&times;</div></div>
    <div class="modal-body">
      <select id="selInf" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:16px">${options}</select>
      <button class="btn btn-primary" onclick="selectInfForReport()">确认</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function selectInfForReport() {
  const id = document.getElementById('selInf').value;
  const data = DB.get();
  const inf = data.influencers.find(i=>i.id===id);
  closeModal();
  if (inf) renderReport(inf);
}

let campaignTab = '7月';
/* ========== Campaigns ========== */
function renderCampaigns() {
  const data = DB.get();
  const cooperated = data.influencers.filter(i=>i.status==='已合作');
  const july = cooperated.filter(i=>i.source==='7月合作达人');
  const august = cooperated.filter(i=>i.source==='8月合作达人');
  const other = cooperated.filter(i=>i.source!=='7月合作达人' && i.source!=='8月合作达人');
  const list = campaignTab==='7月'?july : campaignTab==='8月'?august : other;
  const totalCost = list.reduce((s,i)=>s+(i.cost||0),0);
  const totalViews = list.reduce((s,i)=>s+(i.views||0),0);
  return `
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card"><div class="stat-card-label">合作达人数</div><div class="stat-card-value">${cooperated.length}</div></div>
      <div class="stat-card"><div class="stat-card-label">总投放成本</div><div class="stat-card-value">\u00a5${fmt(cooperated.reduce((s,i)=>s+(i.cost||0),0))}</div></div>
      <div class="stat-card"><div class="stat-card-label">总曝光量</div><div class="stat-card-value">${fmt(cooperated.reduce((s,i)=>s+(i.views||0),0))}</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">投放管理</div></div>
      <div class="card-body">
        <div class="camp-tabs">
          <button class="camp-tab ${campaignTab==='7月'?'active':''}" onclick="switchCampaignTab('7月')">7月合作达人<span class="cnt">(${july.length})</span></button>
          <button class="camp-tab ${campaignTab==='8月'?'active':''}" onclick="switchCampaignTab('8月')">8月合作达人<span class="cnt">(${august.length})</span></button>
          ${other.length>0?'<button class="camp-tab '+(campaignTab==='其他'?'active':'')+'" onclick="switchCampaignTab(\'其他\')">其他已合作<span class="cnt">('+other.length+')</span></button>':''}
        </div>
        <div class="camp-summary">当前视图：<b>${campaignTab==='7月'?'7月合作达人':campaignTab==='8月'?'8月合作达人':'其他已合作'}</b> &nbsp;|&nbsp; 达人 <b>${list.length}</b> 位 &nbsp;|&nbsp; 成本小计 <b>\u00a5${fmt(totalCost)}</b> &nbsp;|&nbsp; 曝光小计 <b>${fmt(totalViews)}</b></div>

          <table class="data-table">

function exportCSV(status) {
  const data = DB.get();
  let infs = data.influencers;
  if (status !== 'all') infs = infs.filter(i=>i.status===status);
  const headers = ['博主名称','主页链接','小红书粉丝量(万)','状态','报备/水下','分类','联系人','联系方式','亮点','有无群聊','时间','成稿内容','最终价格','蒲公英下单价格','成本','达人返点','达人已返点','发布日期','同步平台','兑换码','发布链接1','发布链接2','播放量','点赞','收藏','总互动','分享','备注','来源'];
  const fields = ['name','platform','homepageUrl','followersWan','status','coopType','category','contactPerson','contactInfo','highlights','hasGroupChat','timeline','finalContent','finalPrice','pgyPrice','cost','rebate','rebateDone','publishDate','syncPlatform','redemptionCode','publishLink1','publishLink2','views','likes','saves','totalEngagement','shares','notes','source'];
  let csv = headers.join(',') + '\n';
  infs.forEach(inf => {
    csv += fields.map(f => {
      let v = inf[f] || '';
      v = String(v).replace(/"/g,'""').replace(/\n/g,' ');
      return /[",\n]/.test(v) ? '"' + v + '"' : v;
    }).join(',') + '\n';
  });
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'respal_' + (status==='all'?'all':status) + '_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
  showToast('导出成功: ' + infs.length + '条');
}

function exportJSON() {
  const data = DB.get();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'respal_workbench_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(url);
  showToast('JSON备份已导出');
}

  `;

function processBulkPaste() {
  const text = document.getElementById('bulkPasteArea').value.trim();
  if (!text) { showToast('请先粘贴数据'); return; }
  const lines = text.split(/\n/).filter(l => l.trim());
  const data = DB.get();
  let added = 0, skipped = 0;
  const existingNames = new Set(data.influencers.map(i => i.name));

  lines.forEach(line => {
    const parts = line.split(/\t|,/).map(p => p.trim());
    if (parts.length < 1 || !parts[0]) { skipped++; return; }
    const name = parts[0];
    if (existingNames.has(name)) { skipped++; return; }
    
    const followersWan = parseFloat(parts[2]) || 0;
    const newInf = {
      id: uid('inf'), name: name,
      homepageUrl: parts[1] || '', followersWan: followersWan,
      followers: Math.round(followersWan * 10000),
      coopType: parts[3] || '', category: parts[4] || '',
      contactPerson: parts[5] || '', contactInfo: parts[6] || '',
      highlights: parts[7] || '', status: '待筛选',
      views: 0, likes: 0, saves: 0, shares: 0, cost: 0,
      totalEngagement: 0, source: '批量粘贴', notes: ''
    };
    data.influencers.push(newInf);
    existingNames.add(name);
    added++;
  });
  
  DB.save(data);
  document.getElementById('bulkResult').innerHTML = '<div style="color:var(--success);padding:8px 0">\\u2705 导入成功 ' + added + ' 条，跳过 ' + skipped + ' 条（空行或重复）</div>';
  showToast('导入 ' + added + ' 条达人');
  document.getElementById('navInfCount').textContent = data.influencers.length;
  setTimeout(() => { closeModal(); renderInfTable(); }, 1500);
}

/* ========== CSV Import ========== */
function importCSVFile() { document.getElementById('csvFileInput').click(); }

function handleCSVUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result.replace(/^\uFEFF/, '');
    const lines = text.split(/\n/).filter(l => l.trim());
    if (lines.length < 2) { showToast('CSV文件至少需要表头+1行数据'); return; }
    
    // Parse header
    const headers = parseCSVLine(lines[0]);
    const data = DB.get();
    let added = 0;
    const existingNames = new Set(data.influencers.map(i => i.name));
    
    for (let i = 1; i < lines.length; i++) {
      const values = parseCSVLine(lines[i]);
      const name = values[0]?.trim();
      if (!name || existingNames.has(name)) continue;
      
      const newInf = {
        id: uid('inf'), name: name, status: '待筛选',
        followersWan: 0, followers: 0, views: 0, likes: 0, saves: 0,
        shares: 0, cost: 0, totalEngagement: 0, source: 'CSV导入', notes: ''
      };
      
      // Map by header name
      headers.forEach((h, idx) => {
        const val = values[idx]?.trim() || '';
        const hLower = h.toLowerCase();
        if (h.includes('博主') || h.includes('名称')) newInf.name = val;
        else if (h.includes('链接') || h.includes('主页')) newInf.homepageUrl = val;
        else if (h.includes('粉丝')) { newInf.followersWan = parseFloat(val) || 0; newInf.followers = Math.round(newInf.followersWan * 10000); }
        else if (h.includes('报备') || h.includes('水下')) newInf.coopType = val;
        else if (h.includes('分类')) newInf.category = val;
        else if (h.includes('联系人')) newInf.contactPerson = val;
        else if (h.includes('联系方式')) newInf.contactInfo = val;
        else if (h.includes('亮点')) newInf.highlights = val;
        else if (h.includes('价格')) newInf.finalPrice = val;
        else if (h.includes('成本')) newInf.cost = parseInt(val) || 0;
        else if (h.includes('播放')) newInf.views = parseInt(val) || 0;
        else if (h.includes('点赞')) newInf.likes = parseInt(val) || 0;
        else if (h.includes('收藏')) newInf.saves = parseInt(val) || 0;
        else if (h.includes('分享')) newInf.shares = parseInt(val) || 0;
        else if (h.includes('互动')) newInf.totalEngagement = parseInt(val) || 0;
        else if (h.includes('备注')) newInf.notes = val;
        else if (h.includes('日期') || h.includes('发布')) newInf.publishDate = val;
        else if (h.includes('平台')) newInf.syncPlatform = val;
        else if (h.includes('兑换')) newInf.redemptionCode = val;
        else if (h.includes('状态')) newInf.status = val;
      });
      
      newInf.totalEngagement = newInf.totalEngagement || (newInf.views + newInf.likes + newInf.saves);
      data.influencers.push(newInf);
      existingNames.add(name);
      added++;
    }
    
    DB.save(data);
    showToast('CSV导入 ' + added + ' 条达人');
    document.getElementById('navInfCount').textContent = data.influencers.length;
    renderInfTable();
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = '';
}

function parseCSVLine(line) {
  const result = [];
  let current = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQuotes = !inQuotes; }
    else if ((c === ',' || c === '\t') && !inQuotes) { result.push(current); current = ''; }
    else { current += c; }
  }
  result.push(current);
  return result;
}
